[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "brief-eval-rig"
version = "0.4.1"
description = "Reproducible evaluation framework scoring vision-language models on security video understanding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew Visher" }]
keywords = ["vlm", "evaluation", "video", "security", "benchmark"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6,<3.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=0.4.0",
    "httpx>=0.27.0",
    "opencv-python>=4.10.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "black>=24.0",
    "mypy>=1.8",
]

[project.urls]
Repository = "https://github.com/oneshot2001/brief-eval-rig"
Issues = "https://github.com/oneshot2001/brief-eval-rig/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/brief_eval_rig"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: hits real provider APIs and consumes credits (run with -m live)",
]
